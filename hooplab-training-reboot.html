<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

  <body>
    <div id="shell" tabindex="0">
      <canvas id="game" width="1024" height="576"></canvas>
      <div id="hint">WASD offense · Shift drive · Arrows defender · Enter block · Space stepback · 5/6 stepback · 7/8 3PT arc · J shoot · K pass · E finish/lob · Tab nearest · 1/2 off-make · 3/4 on-miss</div>
    </div>
    <script type="module">
// ===== config.js =====
const VW = 512;
const VH = 288;
const DISPLAY_W = 1024;
const DISPLAY_H = 576;
// Court markings are laid out to true NBA proportions.
// Scale: court width (sideline to sideline) = 50 ft = (bottom - top) = 216 px,
// so 1 ft = 4.32 px. All distances below are that scale measured from the
// baseline (x = left) or the centre line (y = centerY):
//   rim center        5.25 ft from baseline -> 88 + 22.7 = 111
//   backboard         4 ft   from baseline -> 88 + 17.3 = 105
//   free-throw line   19 ft  from baseline -> 88 + 82.1 = 170
//   lane (paint)      16 ft wide           -> +/- 34.6 about centerY = 119..189
//   free-throw circle 6 ft radius          -> 26 (drawn in render)
//   3-pt arc          23.75 ft radius      -> 103
//   restricted arc    4 ft radius          -> 17
//   center circle     6 ft radius          -> 26 (drawn in render)
const COURT = {
    left: 88,
    right: 500,
    top: 46,
    bottom: 262,
    centerX: 294,
    centerY: 154,
    rim: { x: 111, y: 154 },
    backboardX: 105,
    paintLeft: 88,
    paintRight: 170,
    paintTop: 119,
    paintBottom: 189,
    freeThrowX: 170,
    threeRadius: 103,
    restrictedRadius: 17,
    playableLeft: 98,
    playableRight: 490,
    playableTop: 56,
    playableBottom: 252
};
const GAME = {
    playerRadius: 5,
    walkSpeed: 76,
    sprintSpeed: 112,
    accel: 660,
    friction: 0.045,
    ballRadius: 4,
    maxChargeTime: 0.37,
    greenCenter: 0.76,
    passDurationMin: 0.15,
    passDurationMax: 0.42,
    lobDuration: 0.72,
    shotBaseDuration: 0.58,
    resetDelay: 0.85
};
const COLORS = {
    bg0: '#050711',
    crowdBack: '#101629',
    crowdSeat: '#242b43',
    sidelineBlue: '#1e4f91',
    sidelineBlueDark: '#12336b',
    hudInk: '#070914',
    hudBlue: '#203f7c',
    hudBlue2: '#2f62ad',
    hudRed: '#7a2c32',
    hudGold: '#cfa34a',
    ink: '#101521',
    ink2: '#17223b',
    brownInk: '#34221b',
    shadow: '#6a593f',
    wood0: '#e4c27f',
    wood1: '#d5ad68',
    wood2: '#f0d395',
    woodLine: '#b99057',
    line: '#fff2d5',
    lineDim: '#ead9b9',
    paint: '#2d73bb',
    paintDark: '#1d4f8f',
    jersey: '#f7efe0',
    jerseyShade: '#dad5c9',
    blue: '#2d65ad',
    blueDark: '#173762',
    skinLight: '#efc38b',
    skinLightShade: '#be8753',
    skinMed: '#c98959',
    skinMedShade: '#835236',
    skinDark: '#7d5135',
    skinDarkShade: '#3d281e',
    hairBlack: '#11131a',
    hairBrown: '#4c2a1a',
    hairCharcoal: '#2f3441',
    hairNavy: '#0c1628',
    ball: '#c86a36',
    ballDark: '#71351f',
    ballHi: '#ef9a4d',
    white: '#fff8e8',
    gold: '#f4c84d',
    green: '#65e071',
    red: '#d33d3c'
};

// ===== math.js =====
function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
}
function lerp(a, b, t) {
    return a + (b - a) * t;
}
function invLerp(a, b, v) {
    return clamp((v - a) / (b - a), 0, 1);
}
function smoothstep(t) {
    t = clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
}
function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}
function normalize(x, y) {
    const d = Math.hypot(x, y);
    if (d < 0.0001)
        return { x: 0, y: 0 };
    return { x: x / d, y: y / d };
}
function rand(min, max) {
    return min + Math.random() * (max - min);
}
function dot(a, b) {
    return a.x * b.x + a.y * b.y;
}

// ===== entities.js =====
const RESET_SPOTS = {
    PG: { x: 260, y: 154 },
    SG: { x: 321, y: 101 },
    SF: { x: 325, y: 212 },
    PF: { x: 182, y: 112 },
    C: { x: 137, y: 163 }
};
function makeCooldowns() {
    return { shoot: 0, pass: 0, lob: 0, dribble: 0, stepback: 0 };
}
function makeBall(x = 260, y = COURT.centerY) {
    return {
        x, y, z: 0,
        vx: 0, vy: 0, vz: 0,
        mode: 'loose',
        holderId: null,
        receiverId: null,
        shooterId: null,
        fromX: x,
        fromY: y,
        fromZ: 0,
        targetX: x,
        targetY: y,
        elapsed: 0,
        duration: 0.4,
        make: false,
        shotValue: 2,
        quality: 0,
        rimHit: false,
        shotStyle: 'miss',
        shotType: 'jumper',
        floater: false,
        arcScale: 0.8,
        touchedBoard: false,
        rimContacts: 0
    };
}
function rim() {
    return COURT.rim;
}

// ===== input.js =====
const KEY_MAP = {
    KeyW: 'up',
    KeyS: 'down',
    KeyA: 'left',
    KeyD: 'right',
    ArrowUp: 'defUp',
    ArrowDown: 'defDown',
    ArrowLeft: 'defLeft',
    ArrowRight: 'defRight',
    Enter: 'defBlock',
    Numpad0: 'defBlock',
    ShiftLeft: 'shift',
    ShiftRight: 'shift',
    KeyJ: 'shoot',
    KeyK: 'pass',
    KeyE: 'lob',
    KeyL: 'dribble',
    Space: 'stepback',
    Tab: 'switch',
    KeyR: 'reset',
    KeyP: 'pause',
    Digit1: 'offMakeDown',
    Digit2: 'offMakeUp',
    Digit3: 'onMissDown',
    Digit4: 'onMissUp',
    Digit5: 'stepbackDown',
    Digit6: 'stepbackUp',
    Digit7: 'threeArcDown',
    Digit8: 'threeArcUp'
};
class Input {
    down = new Set();
    pressed = new Set();
    released = new Set();
    constructor() {
        window.addEventListener('keydown', (e) => {
            const key = KEY_MAP[e.code];
            if (!key)
                return;
            if (key === 'switch' || key === 'stepback')
                e.preventDefault();
            if (!this.down.has(key))
                this.pressed.add(key);
            this.down.add(key);
        });
        window.addEventListener('keyup', (e) => {
            const key = KEY_MAP[e.code];
            if (!key)
                return;
            this.down.delete(key);
            this.released.add(key);
        });
        window.addEventListener('blur', () => {
            this.down.clear();
            this.pressed.clear();
            this.released.clear();
        });
    }
    axis() {
        const x = (this.down.has('right') ? 1 : 0) - (this.down.has('left') ? 1 : 0);
        const y = (this.down.has('down') ? 1 : 0) - (this.down.has('up') ? 1 : 0);
        return normalize(x, y);
    }
    defenderAxis() {
        const x = (this.down.has('defRight') ? 1 : 0) - (this.down.has('defLeft') ? 1 : 0);
        const y = (this.down.has('defDown') ? 1 : 0) - (this.down.has('defUp') ? 1 : 0);
        return normalize(x, y);
    }
    isDown(k) {
        return this.down.has(k);
    }
    justPressed(k) {
        return this.pressed.has(k);
    }
    justReleased(k) {
        return this.released.has(k);
    }
    endFrame() {
        this.pressed.clear();
        this.released.clear();
    }
}

// ===== physics.js =====
const HOOP_Z = 13;
const RIM_RADIUS = 7.5;
function triggerNet(state, strength, side) {
    state.netTimer = Math.max(state.netTimer, strength);
    state.netSide = clamp(side, -1, 1);
}
function finishMake(state, style, side) {
    const b = state.ball;
    state.makes += 1;
    state.streak += 1;
    state.message = { text: b.shotValue === 3 ? 'SPLASH +3' : 'BUCKET +2', ttl: 1.0 };
    const shooter = state.players.find(p => p.id === b.shooterId);
    if (shooter)
        startAction(shooter, 'celebrate', 0.42);
    triggerNet(state, style === 'swish' ? 0.56 : style === 'rim' ? 0.42 : 0.36, side);
    b.mode = 'made';
    b.fromX = b.x;
    b.fromY = b.y;
    b.fromZ = Math.max(2, b.z);
    b.targetX = rim().x + 3 + side * 1.5;
    b.targetY = rim().y + 12;
    b.elapsed = 0;
    b.duration = style === 'swish' ? 0.24 : 0.3;
    b.vx = 0;
    b.vy = 0;
    b.vz = -16;
    state.resetTimer = GAME.resetDelay;
}
function startRimRoll(state) {
    const b = state.ball;
    const hoopX = rim().x + 2;
    const hoopY = rim().y;
    b.mode = 'rimroll';
    b.elapsed = 0;
    b.duration = 0.48;
    b.fromX = Math.atan2(b.y - hoopY, b.x - hoopX);
    b.fromY = Math.random() < 0.5 ? -1 : 1; // spin direction
    b.fromZ = HOOP_Z + 1;
    b.targetX = hoopX;
    b.targetY = hoopY;
    b.rimContacts += 1;
    state.message = { text: 'AROUND THE RIM', ttl: 0.45 };
    state.screenShake = 0.12;
}
function actionProgress(p) {
    if (p.actionDuration <= 0)
        return 1;
    return clamp(p.actionElapsed / p.actionDuration, 0, 1);
}
function startAction(p, state, duration) {
    p.animState = state;
    p.actionElapsed = 0;
    p.actionDuration = duration;
}
function updatePlayerTimers(p, dt) {
    p.anim += dt;
    p.actionElapsed += dt;
    for (const key of Object.keys(p.cooldowns)) {
        p.cooldowns[key] = Math.max(0, p.cooldowns[key] - dt);
    }
    if (p.actionElapsed >= p.actionDuration) {
        if (p.animState === 'shoot' || p.animState === 'turnshot' || p.animState === 'pass' || p.animState === 'catch' || p.animState === 'layup' || p.animState === 'dunk' || p.animState === 'cross' || p.animState === 'stepback' || p.animState === 'block' || p.animState === 'drive') {
            p.animState = p.hasBall ? 'dribble' : 'idle';
            p.actionElapsed = 0;
            p.actionDuration = 0.01;
        }
        else if (p.animState === 'celebrate') {
            p.animState = p.hasBall ? 'dribble' : 'idle';
            p.actionElapsed = 0;
            p.actionDuration = 0.01;
        }
    }
}
function keepOnCourt(p) {
    p.x = clamp(p.x, COURT.playableLeft, COURT.playableRight);
    p.y = clamp(p.y, COURT.playableTop, COURT.playableBottom);
}
function resetTraining(state, message = 'TRAINING GROUND') {
    for (const p of state.players) {
        const spot = RESET_SPOTS[p.role];
        p.x = spot.x;
        p.y = spot.y;
        p.vx = 0;
        p.vy = 0;
        p.facingX = -1;
        p.facingY = 0;
        p.homeX = spot.x;
        p.homeY = spot.y;
        p.targetX = spot.x;
        p.targetY = spot.y;
        p.cutTimer = rand(0.8, 2.4);
        p.stamina = 1;
        p.pivotLocked = false;
        p.driveTimer = 0;
        p.controlled = p.role === 'PG';
        p.hasBall = p.role === 'PG';
        p.animState = p.hasBall ? 'dribble' : 'idle';
        p.actionElapsed = 0;
        p.actionDuration = 0.01;
        p.cooldowns = { shoot: 0, pass: 0, lob: 0, dribble: 0, stepback: 0 };
    }
    state.defender.x = 178;
    state.defender.y = COURT.centerY;
    state.defender.vx = 0;
    state.defender.vy = 0;
    state.defender.facingX = 1;
    state.defender.facingY = 0;
    state.defender.homeX = state.defender.x;
    state.defender.homeY = state.defender.y;
    state.defender.targetX = state.defender.x;
    state.defender.targetY = state.defender.y;
    state.defender.stamina = 1;
    state.defender.pivotLocked = false;
    state.defender.driveTimer = 0;
    state.defender.controlled = false;
    state.defender.hasBall = false;
    state.defender.animState = 'idle';
    state.defender.actionElapsed = 0;
    state.defender.actionDuration = 0.01;
    state.defender.cooldowns = { shoot: 0, pass: 0, lob: 0, dribble: 0, stepback: 0 };
    const pg = state.players.find(p => p.role === 'PG');
    if (!pg)
        throw new Error('No point guard');
    state.controlledId = pg.id;
    state.ball = {
        x: pg.x - 7,
        y: pg.y + 1,
        z: 5,
        vx: 0,
        vy: 0,
        vz: 0,
        mode: 'held',
        holderId: pg.id,
        receiverId: null,
        shooterId: null,
        fromX: pg.x,
        fromY: pg.y,
        fromZ: 0,
        targetX: pg.x,
        targetY: pg.y,
        elapsed: 0,
        duration: 0.4,
        make: false,
        shotValue: 2,
        quality: 0,
        rimHit: false,
        shotStyle: 'miss',
        shotType: 'jumper',
        floater: false,
        arcScale: 0.8,
        touchedBoard: false,
        rimContacts: 0
    };
    state.shotCharge = null;
    state.pendingShot = null;
    state.resetTimer = 0;
    state.screenShake = 0;
    state.message = { text: message, ttl: 1.0 };
    state.netTimer = 0;
    state.netSide = 0;
}
function handBallTo(state, receiver, showMessage = 'CATCH') {
    for (const p of state.players) {
        p.hasBall = false;
        p.controlled = p.id === receiver.id;
    }
    receiver.hasBall = true;
    receiver.controlled = true;
    receiver.pivotLocked = false;
    receiver.driveTimer = 0;
    receiver.animState = 'catch';
    receiver.actionElapsed = 0;
    receiver.actionDuration = 0.16;
    state.controlledId = receiver.id;
    state.ball.mode = 'held';
    state.ball.holderId = receiver.id;
    state.ball.receiverId = null;
    state.ball.shooterId = null;
    state.message = { text: showMessage, ttl: 0.45 };
}
function resolveSpacing(players) {
    for (let i = 0; i < players.length; i++) {
        const a = players[i];
        if (!a)
            continue;
        for (let j = i + 1; j < players.length; j++) {
            const b = players[j];
            if (!b)
                continue;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const len = Math.hypot(dx, dy) || 0.0001;
            const min = a.radius + b.radius + 1;
            if (len < min) {
                const nx = dx / len;
                const ny = dy / len;
                const push = (min - len) * 0.48;
                a.x -= nx * push;
                a.y -= ny * push;
                b.x += nx * push;
                b.y += ny * push;
            }
        }
    }
    for (const p of players)
        keepOnCourt(p);
}
function beginPass(state, passer, receiver, lob = false) {
    passer.hasBall = false;
    state.pendingShot = null;
    passer.pivotLocked = false;
    passer.driveTimer = 0;
    passer.cooldowns.pass = 0.24;
    if (lob)
        passer.cooldowns.lob = 0.76;
    startAction(passer, 'pass', 0.18);
    const b = state.ball;
    b.mode = lob ? 'lob' : 'pass';
    b.holderId = null;
    b.receiverId = receiver.id;
    b.shooterId = null;
    b.fromX = passer.x + passer.facingX * 7;
    b.fromY = passer.y - 7;
    b.fromZ = lob ? 12 : 9;
    b.x = b.fromX;
    b.y = b.fromY;
    b.z = b.fromZ;
    b.targetX = receiver.x;
    b.targetY = receiver.y - 3;
    b.elapsed = 0;
    b.duration = lob ? GAME.lobDuration : clamp(dist(passer, receiver) / 410, GAME.passDurationMin, GAME.passDurationMax);
    state.message = { text: lob ? 'LOB' : 'PASS', ttl: 0.5 };
}
function beginShot(state, shooter, charge01, forcedFinish = false, selectedShotType = 'jumper', floater = false) {
    const goal = rim();
    const hoopX = goal.x + 2;
    const hoopY = goal.y;
    const d = dist(shooter, goal);
    const dunk = forcedFinish || selectedShotType === 'dunk';
    const layup = !dunk && selectedShotType === 'layup';
    const isThree = d > COURT.threeRadius + 4;
    shooter.hasBall = false;
    state.pendingShot = null;
    shooter.pivotLocked = false;
    shooter.driveTimer = 0;
    shooter.cooldowns.shoot = 0.38;
    startAction(shooter, dunk ? 'dunk' : layup ? 'layup' : 'shoot', dunk ? 0.38 : layup ? 0.34 : 0.28);
    const b = state.ball;
    b.mode = 'shot';
    b.holderId = null;
    b.receiverId = null;
    b.shooterId = shooter.id;
    b.fromX = shooter.x + shooter.facingX * 6;
    b.fromY = shooter.y - (dunk || layup ? 13 : 10);
    b.fromZ = dunk ? HOOP_Z + 13 : layup ? 18 : 14;
    b.x = b.fromX;
    b.y = b.fromY;
    b.z = b.fromZ;
    b.elapsed = 0;
    b.duration = dunk ? 0.30 : layup ? 0.36 : clamp(GAME.shotBaseDuration + d / 900, 0.5, 0.82);
    b.rimHit = false;
    b.touchedBoard = false;
    b.rimContacts = 0;
    b.shotValue = isThree ? 3 : 2;
    b.shotType = dunk ? 'dunk' : layup ? 'layup' : 'jumper';
    b.floater = floater && b.shotType === 'jumper';
    b.arcScale = b.shotType === 'jumper' ? clamp(state.shotArcPower + rand(-0.10, 0.10), 0.35, 1.25) : 1;
    const error = charge01 - GAME.greenCenter; // positive = late/strong; negative = early/short
    const absError = Math.abs(error);
    // Closer shots get a wider 'slightly off' timing window.
    const slightWindow = dunk ? 0.22 : layup ? 0.16 : d < 70 ? 0.12 : isThree ? 0.08 : 0.10;
    const overshot = error > slightWindow;
    const short = error < -slightWindow;
    const severeMistime = clamp((absError - (slightWindow + 0.08)) / 0.32, 0, 1);
    const timingScore = 1 - clamp(absError / (slightWindow + 0.30), 0, 1);
    const movePenalty = clamp(Math.hypot(shooter.vx, shooter.vy) / 500, 0, 0.1);
    // Tunable shot probability model:
    // - onMissChance controls how often an accurately-timed shot can still miss.
    // - offMakeChance controls bailout makes when the release is a decent amount off.
    const perfectBase = dunk ? 0.995 : layup ? 0.985 : d < 70 ? 0.90 : isThree ? 0.56 : 0.74;
    const onTargetMake = clamp(perfectBase - state.onMissChance - movePenalty * 0.75, 0.02, 0.995);
    let makeChance;
    if (dunk) {
        makeChance = 0.995;
    }
    else if (layup) {
        // Layups remain nearly automatic unless the slider is genuinely bad,
        // and their forgiving window is intentionally wider.
        const layupFalloff = clamp((absError - slightWindow) / 0.26, 0, 1);
        makeChance = clamp(onTargetMake - layupFalloff * 0.80, 0.05, 0.99);
    }
    else {
        // Normal jumpers drop off sharply once the release is beyond the distance-adjusted slight window.
        const falloffRange = d < 70 ? 0.26 : isThree ? 0.18 : 0.22;
        const offSeverity = clamp((absError - slightWindow) / falloffRange, 0, 1);
        const sharpFalloff = offSeverity * offSeverity;
        const bailout = state.offMakeChance * (isThree ? 0.72 : d < 70 ? 1.25 : 1.0);
        makeChance = clamp(onTargetMake * (1 - sharpFalloff) + bailout * sharpFalloff, 0.005, 0.99);
    }
    // Tiny randomness only. The adjustable variables carry the real tuning now.
    makeChance = clamp(makeChance + rand(-0.012, 0.012), 0.005, dunk ? 0.995 : 0.99);
    b.quality = makeChance;
    b.make = Math.random() < makeChance;
    state.attempts += 1;
    const roll = Math.random();
    if (dunk) {
        b.shotStyle = 'swish';
    }
    else if (layup) {
        if (b.make)
            b.shotStyle = roll < 0.72 ? 'bank' : roll < 0.93 ? 'rim' : 'swish';
        else
            b.shotStyle = roll < 0.56 ? 'bank' : roll < 0.88 ? 'rim' : 'miss';
    }
    else if (b.make) {
        if (overshot)
            b.shotStyle = roll < 0.44 ? 'bank' : roll < 0.78 ? 'rim' : 'swish';
        else if (short)
            b.shotStyle = roll < 0.58 ? 'rim' : roll < 0.9 ? 'swish' : 'bank';
        else
            b.shotStyle = roll < 0.62 ? 'swish' : roll < 0.86 ? 'rim' : 'bank';
    }
    else {
        if (overshot)
            b.shotStyle = roll < 0.46 ? 'bank' : roll < 0.88 ? 'rim' : 'miss';
        else if (short)
            b.shotStyle = roll < 0.72 ? 'rim' : roll < 0.94 ? 'miss' : 'bank';
        else
            b.shotStyle = roll < 0.68 ? 'rim' : roll < 0.82 ? 'bank' : 'miss';
    }
    // Restore the high arcade arc, but aim the endpoint based on timing.
    // Late/strong releases tend to go long/backboard. Early/short releases tend front/side rim.
    const powerBias = clamp(error / 0.28, -1, 1);
    const sideNoise = rand(-1, 1) * (2.0 + absError * 13 + (isThree ? 2.5 : 0));
    if (b.shotStyle === 'bank') {
        b.targetX = COURT.backboardX + 2 + rand(-1, 1);

            if (holder && p.role !== 'PG' && Math.random() < 0.44) {

                p.targetY = clamp(p.homeY + rand(-24, 24), COURT.playableTop, COURT.playableBottom);

            p.vy = (p.vy / v) * max;

            p.facingY = p.vy / v;

            b.targetY = receiver.y - 3;

    b.y = clamp(b.y, COURT.playableTop, COURT.playableBottom);

        if (dist(p, b) < p.radius + 5 && b.z < 14 && state.resetTimer <= 0) {
            handBallTo(state, p, 'BOARD');
            break;
        }
    }

        // Free-throw circle: 6 ft radius (26 px). Solid half toward mid-court, dashed half inside the lane.

        this.polyline(this.projectedArc(COURT.freeThrowX, COURT.centerY, 26, Math.PI / 2, Math.PI * 1.5, 36), COLORS.line, 2, [4, 4]);

        // court's real scale so it reads like a regulation NBA line.
        //   - Arc radius 23.75 ft from the rim center.
        //   - Corner lines sit 22 ft from the centre line (3 ft off each sideline)
        //     and run straight from the baseline until they meet the arc tangentially.
        // The court is drawn to a single uniform scale (~4.3 px/ft); using that same
        // scale on both axes keeps the arc a real circle in court space, and the
        // camera projection then tilts it into the correct on-screen ellipse.
        // 3PT (7/8) now scales the actual arc radius, so it stays a proper circle at
        // any setting and the corner join re-solves to remain tangent.
        const feetPerPx = (COURT.bottom - COURT.top) / 50; // full court width = 50 ft

        const bottomCornerY = COURT.centerY + cornerOffsetY;

        const joinAngle = Math.asin(Math.min(0.999, cornerDistFt / radiusFt));

            const y = COURT.rim.y + Math.sin(a) * ry;
            threePts.push(this.project(x, y));
        }
        this.polyline(threePts, COLORS.line, 2);
        this.polyline([this.project(joinX, bottomCornerY), this.project(COURT.left, bottomCornerY)], COLORS.line, 2);
        this.polyline(this.projectedArc(COURT.rim.x, COURT.rim.y, COURT.restrictedRadius, -Math.PI / 2, Math.PI / 2, 28), COLORS.line, 2);

        const mp = this.project(398, 153);
        const lab = this.project(398, 175);
        const tr = this.project(395, 238);
        this.text('MP', mp.x, mp.y, '#2c63aa', 30);
        this.text('LAB', lab.x, lab.y, '#2c63aa', 13);
        this.text('TRAINING', tr.x, tr.y, '#b84a3b', 10);
    }
    drawHoopBack() {
        const rim = this.project(COURT.rim.x, COURT.rim.y);
        const lift = 12;
        this.px(rim.x - 29, rim.y - 21 - lift, 16, 34, '#223152');
        this.px(rim.x - 34, rim.y - 11 - lift, 12, 15, '#192136');
        this.px(rim.x - 21, rim.y - 14 - lift, 14, 5, '#d6ecfb');
        this.px(rim.x - 19, rim.y - 11 - lift, 4, 22, COLORS.ink);
        this.px(rim.x - 13, rim.y - 5 - lift, 15, 4, COLORS.brownInk);
        this.px(rim.x - 12, rim.y - 4 - lift, 12, 2, '#b88741');
    }
    drawHoopFront(state) {
        const ctx = this.ctx;
        const rim = this.project(COURT.rim.x, COURT.rim.y);
        const lift = 12;
        const t = clamp(state.netTimer / 0.48, 0, 1);
        const sway = state.netSide * Math.sin((1 - t) * 8.5) * t * 4;
        const stretch = t * 6;
        ctx.save();
        ctx.strokeStyle = COLORS.ink;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(rim.x + 2, rim.y - lift, 8, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = COLORS.red;
        ctx.beginPath();
        ctx.ellipse(rim.x + 2, rim.y - lift, 7, 3, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = COLORS.white;
        ctx.lineWidth = 1;
        const anchors = [-4, 0, 4];
        for (const i of anchors) {
            ctx.beginPath();
            ctx.moveTo(rim.x + i + 2, rim.y + 3 - lift);
            ctx.lineTo(rim.x + Math.round(i * 0.4 + sway), rim.y + 10 - lift + stretch);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(rim.x - 4 + sway, rim.y + 10 - lift + stretch);
        ctx.lineTo(rim.x + 8 + sway, rim.y + 10 - lift + stretch);
        ctx.stroke();
        ctx.restore();
    }
    drawHud(state) {
        this.px(0, 0, VW, 31, COLORS.hudInk);
        this.outlineRect(3, 6, 70, 18, COLORS.hudRed);
        this.outlineRect(76, 6, 115, 18, COLORS.hudBlue);
        this.outlineRect(194, 6, 70, 18, COLORS.hudRed);
        this.outlineRect(268, 6, 74, 18, '#1d2440');
        this.outlineRect(346, 6, 164, 18, '#18213b');

        this.text('TRAINING', 133, 19, COLORS.white, 8);
        this.text(`STK ${state.streak}`, 229, 19, COLORS.white, 8);
        const pct = state.attempts === 0 ? 0 : Math.round((state.makes / state.attempts) * 100);
        this.text(`FG ${state.makes}/${state.attempts} ${pct}%`, 305, 19, COLORS.white, 7);
        this.text(`OFF ${Math.round(state.offMakeChance * 100)} ONM ${Math.round(state.onMissChance * 100)} STP ${Math.round(state.stepbackPower * 100)} 3PT ${Math.round(state.threeArcPower * 100)}`, 428, 19, COLORS.white, 6);
        this.px(146, 26, 72, 3, COLORS.hudBlue2);
        this.text('PRACTICE GYM', 182, 29, COLORS.white, 4);
        if (state.message.ttl > 0) {
            this.text(state.message.text, 256 + 1, 49 + 1, COLORS.ink, 11);
            this.text(state.message.text, 256, 49, COLORS.gold, 11);
        }
    }
    drawPlayerMarker(state) {
        const p = state.players.find(player => player.controlled);
        const pulse = 0.65 + Math.sin(performance.now() * 0.008) * 0.22;
        const ctx = this.ctx;
        if (p) {
            const pos = this.project(p.x, p.y);
            ctx.save();
            ctx.globalAlpha = pulse;
            ctx.strokeStyle = COLORS.gold;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(Math.round(pos.x), Math.round(pos.y + 2), 7, 3, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        const dpos = this.project(state.defender.x, state.defender.y);
        ctx.save();
        ctx.globalAlpha = pulse * 0.85;
        ctx.strokeStyle = COLORS.red;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(Math.round(dpos.x), Math.round(dpos.y + 2), 7, 3, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    drawPlayers(state) {

            this.drawPlayer(p, state);
    }
    skin(index) {
        if (index === 0)
            return { base: COLORS.skinLight, shade: COLORS.skinLightShade, hi: '#f7d6a1' };
        if (index === 1)
            return { base: COLORS.skinMed, shade: COLORS.skinMedShade, hi: '#dfa06d' };
        return { base: COLORS.skinDark, shade: COLORS.skinDarkShade, hi: '#a36d49' };
    }
    hair(index) {
        if (index === 0)
            return COLORS.hairBlack;
        if (index === 1)
            return COLORS.hairBrown;
        if (index === 2)
            return COLORS.hairCharcoal;
        return COLORS.hairNavy;
    }
    drawTinyHair(style, x, y, color) {
        if (style === 0) {
            this.px(x, y, 6, 2, color);
            this.px(x - 1, y + 1, 8, 2, color);
        }
        else if (style === 1) {
            this.px(x - 1, y - 1, 8, 3, color);
            this.px(x + 1, y - 3, 4, 2, color);
        }
        else if (style === 2) {
            this.px(x - 1, y - 1, 3, 4, color);
            this.px(x + 4, y - 1, 3, 4, color);
            this.px(x + 1, y - 2, 4, 2, color);
        }
        else {
            this.px(x - 1, y - 2, 8, 3, color);
            this.px(x - 2, y, 2, 4, color);
            this.px(x + 6, y, 2, 4, color);
        }
    }
    drawPlayer(p, state) {
        const ctx = this.ctx;
        const speed = Math.hypot(p.vx, p.vy);
        const moving = clamp(speed / GAME.sprintSpeed, 0, 1);
        const dir = p.facingX >= 0 ? 1 : -1;
        const runWave = Math.sin(p.anim * 13);
        const runWave2 = Math.sin(p.anim * 13 + Math.PI);
        const bounceWave = Math.sin(p.anim * 8);
        const charge = state.shotCharge?.playerId === p.id ? clamp(state.shotCharge.elapsed / GAME.maxChargeTime, 0, 1) : 0;
        const actionT = p.actionDuration <= 0 ? 1 : clamp(p.actionElapsed / p.actionDuration, 0, 1);
        const skin = this.skin(p.skin);
        const hair = this.hair(p.hair);
        const jersey = p.team === 'away' ? COLORS.hudRed : COLORS.jersey;
        const jerseyShade = p.team === 'away' ? '#53222b' : COLORS.jerseyShade;
        const trim = p.team === 'away' ? '#f0d395' : COLORS.blue;
        const trimDark = p.team === 'away' ? '#311722' : COLORS.blueDark;
        // Stronger retro pass: chunkier blocks, fewer micro-details, silhouette closer to Retro Bowl style.
        let bodyBob = Math.round(runWave * moving * 0.25);
        let jump = 0;
        let torsoShift = Math.round((p.facingX < 0 ? -1 : 1) * moving * 0.2);
        let armL = Math.round(runWave2 * moving);
        let armR = Math.round(runWave * moving);
        let footL = Math.round(runWave * moving);
        let footR = Math.round(runWave2 * moving);
        let armRaise = 0;
        let torsoLean = 0;
        if (p.hasBall && (p.animState === 'dribble' || p.animState === 'cross')) {
            bodyBob += bounceWave > 0 ? 0 : 1;
            armL += bounceWave > 0 ? 1 : -1;
            armR += bounceWave > 0 ? -1 : 1;
        }
        if (p.animState === 'cross')
            torsoShift += Math.round(2 * Math.sin(actionT * Math.PI));
        if (p.animState === 'stepback') {
            torsoShift -= Math.round(4 * Math.sin(actionT * Math.PI));
            torsoLean -= dir;
            footL -= 1;
            footR += 1;
        }
        if (charge > 0) {
            const shot = state.shotCharge?.playerId === p.id ? state.shotCharge : null;
            if (shot?.shotType === 'layup') {
                armRaise = 7;
                jump = 1 + Math.round(Math.sin(charge * Math.PI) * 4);
                torsoLean = dir;
            }
            else if (shot?.shotType === 'dunk') {
                armRaise = 13;
                const lift = Math.sin(charge * Math.PI);
                jump = 7 + Math.round(lift * 10);
                torsoLean = dir * 2;
            }
            else {
                // Default shot is now a real jumper every time.
                armRaise = Math.round(lerp(4, 8, charge));
                const lift = Math.sin(Math.PI * clamp(charge * 0.9, 0, 1));
                jump = 2 + Math.round(lift * 5);
                torsoLean = dir;
            }
            footL = 0;
            footR = 0;
        }
        else if (p.animState === 'drive') {
            // Simple gather: ball is held close and body movement stays subtle.
            const gather = Math.sin(actionT * Math.PI);
            torsoLean = dir;
            bodyBob -= Math.round(gather * 0.3);
            armL = 0;
            armR = 0;
            footL += Math.round(Math.sin(actionT * Math.PI * 2) * 0.4);
            footR += Math.round(Math.sin(actionT * Math.PI * 2 + Math.PI) * 0.4);
        }
        else if (p.animState === 'turnshot') {
            armRaise = 3 + Math.round(actionT * 2);
            torsoLean = dir;
            jump = Math.round(Math.sin(actionT * Math.PI) * 1.5);
            footL = 0;
            footR = 0;
        }
        else if (p.animState === 'shoot') {
            armRaise = 6;
            jump = Math.round(Math.sin(actionT * Math.PI) * 3);
            footL = 0;
            footR = 0;
        }
        else if (p.animState === 'layup') {
            armRaise = 7;
            jump = 1 + Math.round(Math.sin(actionT * Math.PI) * 4);
            torsoLean = dir;
        }
        else if (p.animState === 'dunk') {
            armRaise = 13;
            const dunkLift = Math.sin(Math.PI * clamp(actionT * 0.9, 0, 1));
            jump = 7 + Math.round(dunkLift * 10);
            torsoLean = dir * 2;
            footL = 0;
            footR = 0;
        }
        else if (p.animState === 'block') {
            armRaise = 10;
            const blockLift = Math.sin(Math.PI * clamp(actionT * 0.92, 0, 1));
            jump = 3 + Math.round(blockLift * 7);
            torsoLean = dir;
            footL = 0;
            footR = 0;
        }
        else if (p.animState === 'pass') {
            torsoLean = dir;
            armL = -1;
            armR = -1;
        }
        else if (p.animState === 'catch') {
            armL = 0;
            armR = 0;
            bodyBob -= 1;
        }
        else if (p.animState === 'celebrate') {
            armRaise = 6;
            jump = Math.round(Math.sin(p.anim * 12) * 1.0 + 1.0);
            footL = 0;
            footR = 0;
        }
        const pos = this.project(p.x, p.y, jump);
        const x = Math.round(pos.x);
        const y = Math.round(pos.y + bodyBob);
        ctx.save();
        ctx.translate(x, y);
        if (dir > 0)
            ctx.scale(-1, 1);
        ctx.save();
        ctx.globalAlpha = clamp(0.32 - jump * 0.025, 0.14, 0.32);
        this.px(-4, 2 + jump, 8, 2, COLORS.ink);
        ctx.restore();

        this.px(-4 + footL, 0, 3, 2, '#202737');
        this.px(1 + footR, 0, 3, 2, '#202737');
        this.px(-4 + footL, 1, 3, 1, COLORS.white);
        this.px(1 + footR, 1, 3, 1, COLORS.white);
        // Shorts block.
        this.px(-5 + torsoShift, -4, 10, 3, COLORS.ink);
        this.px(-4 + torsoShift, -4, 8, 2, trimDark);
        // Main torso/jacket block: simpler and more squared off.
        this.px(-5 + torsoShift + torsoLean, -12, 10, 8, COLORS.ink);
        this.px(-4 + torsoShift + torsoLean, -11, 8, 6, jersey);
        this.px(-4 + torsoShift + torsoLean, -11, 8, 1, trim);
        this.px(-4 + torsoShift + torsoLean, -6, 8, 1, trimDark);
        // Small retro-style shoulder accent to break up the jersey.
        this.px(2 + torsoShift + torsoLean, -10, 1, 2, '#d05a4e');
        this.px(1 + torsoShift + torsoLean, -10, 1, 2, '#456fb6');
        const raised = armRaise > 0;
        if (raised) {
            if (p.animState === 'block') {
                this.px(-7 + torsoShift, -12 - Math.round(armRaise * 0.7), 2, 7, skin.shade);
                this.px(5 + torsoShift, -12 - armRaise, 2, 8, skin.base);
                this.px(-7 + torsoShift, -14 - Math.round(armRaise * 0.7), 3, 2, skin.hi);
                this.px(4 + torsoShift, -14 - armRaise, 3, 2, skin.hi);
            }
            else if (p.animState === 'dunk') {
                this.px(-6 + torsoShift + torsoLean, -15 - armRaise, 2, 10, skin.shade);
                this.px(4 + torsoShift + torsoLean, -15 - armRaise, 2, 10, skin.base);
                this.px(-6 + torsoShift + torsoLean, -17 - armRaise, 3, 2, skin.hi);
                this.px(3 + torsoShift + torsoLean, -17 - armRaise, 3, 2, skin.hi);
            }
            else {
                this.px(-7 + torsoShift, -10 - Math.round(armRaise * 0.25), 2, 5, skin.shade);
                this.px(5 + torsoShift, -11 - armRaise, 2, 6, skin.base);

        }
        else if (p.animState === 'pass') {
            this.px(-7 + torsoShift, -9, 3, 2, skin.shade);
            this.px(5 + torsoShift, -9, 3, 2, skin.base);
        }
        else {
            this.px(-7 + torsoShift, -10 + armL, 2, 5, skin.shade);
            this.px(5 + torsoShift, -10 + armR, 2, 5, skin.base);
        }
        // Head block: flatter, more helmet/hair-band feel than the previous smoother face.
        this.px(-4 + torsoShift + torsoLean, -18, 8, 7, COLORS.ink);
        this.px(-3 + torsoShift + torsoLean, -17, 6, 5, skin.base);
        this.px(-3 + torsoShift + torsoLean, -19, 6, 2, hair);
        this.px(-1 + torsoShift + torsoLean, -15, 1, 1, COLORS.ink);
        this.px(1 + torsoShift + torsoLean, -15, 1, 1, COLORS.ink);
        ctx.restore();
        if (p.controlled)
            this.drawStamina(pos, p.stamina);
        if (p.controlled && p.pivotLocked)
            this.text('PIVOT', pos.x, pos.y + 13, COLORS.gold, 5);
        if (charge > 0)
            this.drawShotMeter(pos, charge);
    }
    drawStamina(pos, stamina) {
        const x = Math.round(pos.x - 7);
        const y = Math.round(pos.y + 6);
        this.px(x, y, 14, 3, COLORS.ink);
        this.px(x + 1, y + 1, Math.round(12 * stamina), 1, stamina > 0.28 ? COLORS.green : COLORS.red);
    }
    drawShotMeter(pos, charge) {
        const x = Math.round(pos.x + 9);
        const y = Math.round(pos.y - 23);
        const h = 21;
        this.px(x, y, 7, h, COLORS.ink);
        this.px(x + 1, y + 1, 5, h - 2, '#29304a');
        const green = y + Math.round((1 - GAME.greenCenter) * (h - 4)) + 1;
        this.px(x + 1, green, 5, 3, COLORS.green);
        this.px(x + 2, y + h - 2 - Math.round((h - 4) * charge), 3, Math.round((h - 4) * charge), charge > 0.69 && charge < 0.84 ? COLORS.green : COLORS.gold);

    drawBall(b) {
        const ctx = this.ctx;
        const pos = this.project(b.x, b.y, b.z);
        const sx = Math.round(pos.x);
        const sy = Math.round(this.project(b.x, b.y).y + 2);
        ctx.save();
        ctx.globalAlpha = 0.28;

        ctx.beginPath();
        ctx.ellipse(sx, sy, 4 + clamp(b.z / 30, 0, 2), 2, 0, 0, Math.PI * 2);
        ctx.fill();

        this.px(x - r + 2, y - r + 1, 2, 1, COLORS.ballHi);
        this.px(x - r + 1, y, r * 2 - 1, 1, COLORS.ballDark);
        this.px(x, y - r + 1, 1, r * 2 - 1, COLORS.ballDark);
        ctx.restore();
    }
    drawPause() {
        this.px(0, 0, VW, VH, 'rgba(0,0,0,.42)');
        this.text('PAUSED', VW / 2, VH / 2, COLORS.white, 18);
    }
}

        facingY: 0,
        radius: GAME.playerRadius,
        controlled: false,
        hasBall: false,
        stamina: 1,
        pivotLocked: false,
        driveTimer: 0,
        homeX: 178,
        homeY: COURT.centerY,
        targetX: 178,
        targetY: COURT.centerY,
        cutTimer: 0,
        skin: 1,
        hair: 2,
        heightClass: 0,
        anim: rand(0, 2),
        animState: 'idle',
        actionElapsed: 0,
        actionDuration: 0.01,
        cooldowns: makeCooldowns()
    };
    return {
        players,
        defender,
        ball: makeBall(),
        controlledId: 0,
        shotCharge: null,
        pendingShot: null,
        makes: 0,
        attempts: 0,
        streak: 0,
        resetTimer: 0,
        screenShake: 0,
        message: { text: '', ttl: 0 },
        netTimer: 0,
        netSide: 0,
        offMakeChance: 0.035,
        onMissChance: 0.10,
        defenderLunge: 0.20,
        stepbackPower: 1.00,
        shotArcPower: 0.80,
        threeArcPower: 1.00,
        paused: false
    };
}
function update(dt) {
    if (input.justPressed('pause'))
        state.paused = !state.paused;
    if (input.justPressed('reset'))
        resetTraining(state, 'RESET');
    if (input.justPressed('offMakeDown')) {
        state.offMakeChance = clamp(Number((state.offMakeChance - 0.01).toFixed(3)), 0, 0.20);
        state.message = { text: `OFF MAKE ${Math.round(state.offMakeChance * 100)}%`, ttl: 0.7 };
    }
    if (input.justPressed('offMakeUp')) {
        state.offMakeChance = clamp(Number((state.offMakeChance + 0.01).toFixed(3)), 0, 0.20);
        state.message = { text: `OFF MAKE ${Math.round(state.offMakeChance * 100)}%`, ttl: 0.7 };
    }
    if (input.justPressed('onMissDown')) {
        state.onMissChance = clamp(Number((state.onMissChance - 0.01).toFixed(3)), 0, 0.30);
        state.message = { text: `ON MISS ${Math.round(state.onMissChance * 100)}%`, ttl: 0.7 };
    }
    if (input.justPressed('onMissUp')) {
        state.onMissChance = clamp(Number((state.onMissChance + 0.01).toFixed(3)), 0, 0.30);
        state.message = { text: `ON MISS ${Math.round(state.onMissChance * 100)}%`, ttl: 0.7 };
    }
    if (input.justPressed('stepbackDown')) {
        state.stepbackPower = clamp(Number((state.stepbackPower - 0.05).toFixed(2)), 0.50, 1.80);
        state.message = { text: `STEPBACK ${Math.round(state.stepbackPower * 100)}%`, ttl: 0.7 };
    }
    if (input.justPressed('stepbackUp')) {
        state.stepbackPower = clamp(Number((state.stepbackPower + 0.05).toFixed(2)), 0.50, 1.80);
        state.message = { text: `STEPBACK ${Math.round(state.stepbackPower * 100)}%`, ttl: 0.7 };
    }
    if (input.justPressed('threeArcDown')) {
        state.threeArcPower = clamp(Number((state.threeArcPower - 0.05).toFixed(2)), 0.70, 1.55);
        state.message = { text: `3PT ARC ${Math.round(state.threeArcPower * 100)}%`, ttl: 0.7 };
    }
    if (input.justPressed('threeArcUp')) {
        state.threeArcPower = clamp(Number((state.threeArcPower + 0.05).toFixed(2)), 0.70, 1.55);
        state.message = { text: `3PT ARC ${Math.round(state.threeArcPower * 100)}%`, ttl: 0.7 };
    }
    if (state.paused)
        return;
    state.message.ttl = Math.max(0, state.message.ttl - dt);
    state.screenShake = Math.max(0, state.screenShake - dt * 3);
    state.netTimer = Math.max(0, state.netTimer - dt * 2.6);
    for (const p of state.players)
        updatePlayerTimers(p, dt);
    updatePlayerTimers(state.defender, dt);
    updatePendingShot(dt);
    if (state.resetTimer > 0) {
        state.resetTimer -= dt;
        updateBall(state, dt);
        for (const p of [...state.players, state.defender]) {
            p.vx *= Math.pow(0.03, dt);
            p.vy *= Math.pow(0.03, dt);
        }
        if (state.resetTimer <= 0)
            resetTraining(state, 'NEXT REP');
        return;
    }
    handleControls(dt);
    handleDefenderControls(dt);
    updateTeammates(state, dt);
    for (const p of [...state.players, state.defender]) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        const blocking = p === state.defender && p.animState === 'block' && p.actionElapsed < p.actionDuration;
        const friction = blocking ? 0.52 : GAME.friction;
        p.vx *= Math.pow(friction, dt);
        p.vy *= Math.pow(friction, dt);
        keepOnCourt(p);
        const v = Math.hypot(p.vx, p.vy);
        if (!p.hasBall && p.actionElapsed >= p.actionDuration) {
            p.animState = v > 12 ? 'run' : 'idle';
        }
    }
    resolveSpacing([...state.players, state.defender]);
    updateBall(state, dt);
}
function controlledPlayer() {
    return state.players.find(p => p.id === state.controlledId);
}
function handleControls(dt) {
    if (input.justPressed('switch'))
        switchControlled();
    const p = controlledPlayer();
    if (!p)
        return;
    const axis = input.axis();
    const moving = Math.hypot(axis.x, axis.y) > 0.05;
    const charging = state.shotCharge?.playerId === p.id;
    const pending = state.pendingShot?.playerId === p.id;
    const driving = p.hasBall && p.driveTimer > 0;
    const pickedUp = p.hasBall && p.pivotLocked;
    const toRim = normalize(rim().x - p.x, rim().y - p.y);
    const vel = normalize(p.vx, p.vy);
    const movingTowardHoop = Math.hypot(p.vx, p.vy) > 10 && (vel.x * toRim.x + vel.y * toRim.y) > 0.42;
    if (p.hasBall && input.justPressed('shift') && !charging && !pending && !pickedUp && !driving) {
        const driveDir = moving ? axis : toRim;
        p.facingX = driveDir.x || p.facingX || -1;
        p.facingY = driveDir.y || p.facingY;
        p.driveTimer = 0.52;
        p.pivotLocked = false;
        p.vx = p.vx * 0.35 + p.facingX * 82;
        p.vy = p.vy * 0.35 + p.facingY * 82;
        startAction(p, 'drive', 0.52);
        state.message = { text: 'DRIVE', ttl: 0.45 };
    }
    if (driving) {
        p.driveTimer = Math.max(0, p.driveTimer - dt);
        if (moving) {
            const currentFacing = normalize(p.facingX, p.facingY);
            const turnCost = clamp(1 - (axis.x * currentFacing.x + axis.y * currentFacing.y), 0, 2);
            // Harder drive direction changes: still possible, but they shorten the drive.
            p.driveTimer = Math.max(0, p.driveTimer - dt * turnCost * 0.62);
            p.vx *= Math.max(0.86, 1 - turnCost * 0.045);
            p.vy *= Math.max(0.86, 1 - turnCost * 0.045);
            const turnRate = 0.16;
            p.facingX = p.facingX * (1 - turnRate) + axis.x * turnRate;
            p.facingY = p.facingY * (1 - turnRate) + axis.y * turnRate;
            const f = normalize(p.facingX, p.facingY);
            p.facingX = f.x || p.facingX || -1;
            p.facingY = f.y || p.facingY;
            p.vx += axis.x * GAME.accel * 1.28 * dt;
            p.vy += axis.y * GAME.accel * 1.28 * dt;
        }
        else {
            p.vx += p.facingX * GAME.accel * 0.12 * dt;
            p.vy += p.facingY * GAME.accel * 0.12 * dt;
        }
        p.stamina = Math.max(0, p.stamina - dt * 0.34);
        if (p.driveTimer <= 0) {
            p.pivotLocked = true;
            p.vx *= 0.46;
            p.vy *= 0.46;
            if (p.actionElapsed >= p.actionDuration)
                p.animState = 'dribble';
            state.message = { text: 'PASS OR FINISH', ttl: 0.65 };
        }
    }
    if (moving && !pickedUp && !driving && !pending) {
        const movingAway = axis.x * toRim.x + axis.y * toRim.y < -0.18;
        if (movingAway) {
            // If you are actively moving away from the hoop, keep that heading.
            p.facingX = axis.x;
            p.facingY = axis.y;
        }
        else {
            // Otherwise the ball handler naturally squares up toward the rim.
            const turn = 0.18;
            p.facingX = p.facingX * (1 - turn) + toRim.x * turn;
            p.facingY = p.facingY * (1 - turn) + toRim.y * turn;
            const f = normalize(p.facingX, p.facingY);
            p.facingX = f.x || -1;
            p.facingY = f.y;
        }
    }
    else if (p.hasBall && !driving) {
        // After you stop moving away, the player should quickly re-square to the basket.
        const turn = pending ? 0.34 : pickedUp ? 0.14 : 0.18;
        p.facingX = p.facingX * (1 - turn) + toRim.x * turn;
        p.facingY = p.facingY * (1 - turn) + toRim.y * turn;
        const f = normalize(p.facingX, p.facingY);
        p.facingX = f.x || -1;
        p.facingY = f.y;
    }
    const maxSpeed = (driving ? GAME.sprintSpeed * 1.05 : GAME.walkSpeed) * (p.hasBall ? 0.92 : 1);
    const controlScale = charging || pending ? 0.14 : pickedUp || driving ? 0 : 1;
    p.vx += axis.x * GAME.accel * controlScale * dt;
    p.vy += axis.y * GAME.accel * controlScale * dt;
    if (pending) {
        if (movingTowardHoop && driving) {
            // Keep the drive finish fluid.
        }
        else if (movingTowardHoop) {
            p.vx *= Math.pow(0.28, dt);
            p.vy *= Math.pow(0.28, dt);
        }
        else {
            p.vx *= Math.pow(0.006, dt);
            p.vy *= Math.pow(0.006, dt);
        }
    }
    else if (charging) {
        if (movingTowardHoop && driving) {
            // Keep the drive finish fluid.
        }
        else if (movingTowardHoop) {
            p.vx *= Math.pow(0.36, dt);
            p.vy *= Math.pow(0.36, dt);
        }
        else {
            p.vx *= Math.pow(0.012, dt);
            p.vy *= Math.pow(0.012, dt);
        }
    }
    if (pickedUp && !charging && !pending && p.animState !== 'stepback') {
        p.vx *= Math.pow(0.015, dt);
        p.vy *= Math.pow(0.015, dt);
        if (moving && state.message.ttl <= 0.05)
            state.message = { text: 'NO TRAVEL: PASS/SHOOT', ttl: 0.45 };
    }
    const v = Math.hypot(p.vx, p.vy);
    if (v > maxSpeed) {
        p.vx = (p.vx / v) * maxSpeed;
        p.vy = (p.vy / v) * maxSpeed;
    }
    if (!driving)
        p.stamina = Math.min(1, p.stamina + dt * 0.22);
    if (p.actionElapsed >= p.actionDuration && !charging && !pending && !driving) {
        if (p.hasBall)
            p.animState = 'dribble';
        else
            p.animState = moving ? 'run' : 'idle';
    }
    if (p.hasBall)
        handleBallControls(p, dt);
}
function updatePendingShot(dt) {
    const pending = state.pendingShot;
    if (!pending)
        return;
    const p = state.players.find(player => player.id === pending.playerId);
    if (!p || !p.hasBall) {
        state.pendingShot = null;
        return;
    }
    pending.elapsed += dt;
    const toRim = normalize(rim().x - p.x, rim().y - p.y);
    p.facingX = p.facingX * 0.62 + toRim.x * 0.38;
    p.facingY = p.facingY * 0.62 + toRim.y * 0.38;
    const f = normalize(p.facingX, p.facingY);
    p.facingX = f.x || -1;
    p.facingY = f.y;
    if (pending.elapsed >= pending.duration) {
        state.pendingShot = null;
        state.shotCharge = { playerId: p.id, elapsed: 0, shotType: pending.shotType, floater: pending.floater, wasDriving: pending.wasDriving };
        startAction(p, 'shoot', 999);
    }
}
function handleDefenderControls(dt) {
    const d = state.defender;
    const axis = input.defenderAxis();
    const moving = Math.hypot(axis.x, axis.y) > 0.05;
    const blocking = d.animState === 'block' && d.actionElapsed < d.actionDuration;
    if (input.justPressed('defBlock') && !blocking) {
        const toBall = normalize(state.ball.x - d.x, state.ball.y - d.y);
        d.facingX = toBall.x || d.facingX || 1;
        d.facingY = toBall.y || d.facingY;
        // A real block commitment: leap toward the ball and carry momentum.
        const distance = dist(d, state.ball);
        const baseLunge = clamp(230 - distance * 0.32, 145, 230);
        const lunge = baseLunge * 0.20;
        d.vx = d.vx * 0.45 + d.facingX * lunge;
        d.vy = d.vy * 0.45 + d.facingY * lunge;
        startAction(d, 'block', 0.56);
        state.message = { text: 'BLOCK LUNGE', ttl: 0.45 };
    }
    if (moving && !blocking) {
        d.facingX = axis.x;
        d.facingY = axis.y;
    }
    else {
        const toBall = normalize(state.ball.x - d.x, state.ball.y - d.y);
        const turnRate = blocking ? 0.015 : 0.08;
        d.facingX = d.facingX * (1 - turnRate) + toBall.x * turnRate;
        d.facingY = d.facingY * (1 - turnRate) + toBall.y * turnRate;
        const f = normalize(d.facingX, d.facingY);
        d.facingX = f.x || 1;
        d.facingY = f.y;
    }
    // While blocking, steering is intentionally weak so pump-fakes punish you.
    const controlScale = blocking ? 0.08 : 0.92;
    d.vx += axis.x * GAME.accel * controlScale * dt;
    d.vy += axis.y * GAME.accel * controlScale * dt;
    const v = Math.hypot(d.vx, d.vy);
    const maxSpeed = blocking ? GAME.sprintSpeed * 0.94 : GAME.sprintSpeed * 0.96;
    if (v > maxSpeed) {
        d.vx = (d.vx / v) * maxSpeed;
        d.vy = (d.vy / v) * maxSpeed;
    }
    if (!blocking && d.actionElapsed >= d.actionDuration)
        d.animState = moving ? 'run' : 'idle';
}
function handleBallControls(p, dt) {
    const locked = p.pivotLocked;
    const driving = p.driveTimer > 0;
    if (input.justPressed('shoot') && p.cooldowns.shoot <= 0 && !state.pendingShot) {
        const shotType = chooseShotType(p, driving);
        const toHoop = normalize(rim().x - p.x, rim().y - p.y);
        const facingDot = p.facingX * toHoop.x + p.facingY * toHoop.y;
        const shootAxis = input.axis();
        const shootMoving = Math.hypot(shootAxis.x, shootAxis.y) > 0.05;
        const activeAwayMove = shootMoving && (shootAxis.x * toHoop.x + shootAxis.y * toHoop.y < -0.18);
        const prepThreshold = 0.82;
        const needsTurn = shotType === 'jumper' && (activeAwayMove || facingDot < prepThreshold);
        if (needsTurn) {
            const turnSeverity = clamp((prepThreshold - facingDot) / (1 + prepThreshold), 0, 1);
            const prepDuration = activeAwayMove
                ? clamp(0.10 + turnSeverity * 0.18, 0.10, 0.28)
                : clamp(0.06 + turnSeverity * 0.14, 0.06, 0.22);
            state.pendingShot = { playerId: p.id, elapsed: 0, duration: prepDuration, shotType, floater: false, wasDriving: driving };
            startAction(p, 'turnshot', prepDuration);
            if (activeAwayMove || facingDot < 0.15) {
                p.vx *= 0.18;
                p.vy *= 0.18;
            }
            state.message = { text: activeAwayMove || facingDot < 0 ? 'TURNAROUND' : 'SHOT PREP', ttl: 0.45 };
        }
        else {
            state.shotCharge = { playerId: p.id, elapsed: 0, shotType, floater: false, wasDriving: driving };
            startAction(p, shotType === 'dunk' ? 'dunk' : shotType === 'layup' ? 'layup' : 'shoot', 999);
        }
    }
    if (state.shotCharge?.playerId === p.id) {
        const chargeState = state.shotCharge;
        chargeState.elapsed = Math.min(GAME.maxChargeTime, chargeState.elapsed + dt);
        if (input.justReleased('shoot') || chargeState.elapsed >= GAME.maxChargeTime) {
            const charge = chargeState.elapsed / GAME.maxChargeTime;
            const shotType = chargeState.shotType;
            state.shotCharge = null;
            beginShot(state, p, charge, false, shotType, false);
            return;
        }
    }
    if (input.justPressed('pass') && p.cooldowns.pass <= 0) {
        const target = choosePassTarget(p);
        if (target)
            beginPass(state, p, target, false);
    }
    if (input.justPressed('lob') && p.cooldowns.lob <= 0) {
        const nearRim = dist(p, rim()) < 35;
        if (nearRim)
            beginShot(state, p, 0.82, true);
        else {
            const target = chooseLobTarget(p);
            if (target)
                beginPass(state, p, target, true);
        }
    }
    if (!state.shotCharge && input.justPressed('dribble') && !locked && !driving && p.cooldowns.dribble <= 0) {
        p.cooldowns.dribble = 0.55;
        const side = Math.random() < 0.5 ? -1 : 1;
        const lateral = { x: -p.facingY * side, y: p.facingX * side };
        p.vx += lateral.x * 132 + p.facingX * 24;
        p.vy += lateral.y * 132 + p.facingY * 24;
        startAction(p, 'cross', 0.2);
        state.message = { text: 'CROSS', ttl: 0.42 };
    }
    if (input.justPressed('stepback') && !locked && !driving && p.cooldowns.stepback <= 0) {
        p.cooldowns.stepback = 0.72;
        const away = normalize(p.x - COURT.rim.x, p.y - COURT.rim.y);
        const stepForce = 230 * state.stepbackPower;
        p.vx += away.x * stepForce;
        p.vy += away.y * stepForce;
        p.pivotLocked = true;
        p.driveTimer = 0;
        startAction(p, 'stepback', 0.32);
        state.message = { text: 'STEPBACK', ttl: 0.52 };
    }
}
function inPaint(p) {
    return p.x >= COURT.paintLeft && p.x <= COURT.paintRight && p.y >= COURT.paintTop && p.y <= COURT.paintBottom;
}
function inClosePaintHalf(p) {
    const midPaintX = (COURT.paintLeft + COURT.paintRight) / 2;
    return inPaint(p) && p.x <= midPaintX;
}
function chooseShotType(p, driving) {
    if (driving && inClosePaintHalf(p))
        return 'dunk';
    if (driving && inPaint(p))
        return 'layup';
    if (!driving && inClosePaintHalf(p))
        return 'layup';
    return 'jumper';
}
function choosePassTarget(passer) {
    const axis = input.axis();
    const hasAxis = Math.hypot(axis.x, axis.y) > 0.1;
    let best = null;
    let bestScore = -Infinity;
    for (const t of state.players) {
        if (t.id === passer.id)
            continue;
        const toT = normalize(t.x - passer.x, t.y - passer.y);
        const directional = hasAxis ? toT.x * axis.x + toT.y * axis.y : 0;
        const rimGravity = 1 - clamp(dist(t, rim()) / 220, 0, 1);
        const score = directional * 120 + rimGravity * 28 - dist(passer, t) * 0.03 + (t.role === 'C' ? 7 : 0);
        if (score > bestScore) {
            best = t;
            bestScore = score;
        }
    }
    return best;
}
function chooseLobTarget(passer) {
    let best = null;
    let bestScore = -Infinity;
    for (const t of state.players) {
        if (t.id === passer.id)
            continue;
        const score = 110 - dist(t, rim()) - dist(t, passer) * 0.02 + (t.role === 'C' ? 22 : t.role === 'PF' ? 12 : 0);
        if (score > bestScore) {
            best = t;
            bestScore = score;
        }
    }
    return bestScore > 8 ? best : choosePassTarget(passer);
}
function switchControlled() {
    let next = null;
    let best = Infinity;
    for (const p of state.players) {
        const d = dist(p, state.ball);
        if (d < best) {
            best = d;
            next = p;
        }
    }
    if (!next)
        return;
    for (const p of state.players)
        p.controlled = false;
    next.controlled = true;
    state.controlledId = next.id;
    state.message = { text: `${next.name} ON BALL`, ttl: 0.45 };
}
